<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali Game Night</title>
<meta name="description" content="Bollywood party games for Diwali night">
<meta property="og:title" content="🪔 Diwali Game Night">
<meta property="og:description" content="Tap to join the games: Tambola, Heads Up, Charades, Pictionary, Taboo and Ramgarh Mafia">

<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪔</text></svg>">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#1d0b3a; --bg2:#2a1052; --card:#341466; --card2:#40197a; --line:rgba(255,255,255,.12);
  --text:#fff; --muted:#cbb8ee; --ink:#1b0a33;
  --gold:#ffb703; --orange:#fb8500; --pink:#ff4d8d; --teal:#06d6a0; --red:#ef476f; --blue:#4cc9f0; --violet:#9b5de5;
  --t0:#ffb703; --t1:#ff4d8d;
  --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);
  background-image:
    radial-gradient(circle at 12% -10%, rgba(255,183,3,.22), transparent 40%),
    radial-gradient(circle at 100% 10%, rgba(255,77,141,.22), transparent 45%),
    radial-gradient(circle at 50% 120%, rgba(155,93,229,.35), transparent 50%);
  background-attachment:fixed;
  color:var(--text); font-family:'Baloo 2',system-ui,sans-serif; font-size:17px; line-height:1.35;
  -webkit-tap-highlight-color:transparent; overflow-x:hidden;
}
button{font-family:inherit}
#app{max-width:1100px;margin:0 auto;padding:12px 16px 40px;min-height:100%}
h1,h2,h3{margin:0;line-height:1.1;font-weight:800}
.muted{color:var(--muted)}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.stack{display:flex;flex-direction:column;gap:12px}
.spacer{height:14px}

/* chunky party buttons */
.btn{
  --c:var(--gold); --tc:var(--ink);
  background:var(--c); color:var(--tc); border:0; border-radius:16px;
  padding:12px 20px; font-size:18px; font-weight:800; cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.35), inset 0 -3px 0 rgba(0,0,0,.12);
  transition:transform .06s, box-shadow .06s; user-select:none; touch-action:manipulation;
}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.btn:disabled{opacity:.45;cursor:default}
.btn.pink{--c:var(--pink);--tc:#fff}.btn.teal{--c:var(--teal)}.btn.red{--c:var(--red);--tc:#fff}
.btn.blue{--c:var(--blue)}.btn.violet{--c:var(--violet);--tc:#fff}.btn.ghost{--c:rgba(255,255,255,.12);--tc:#fff}
.btn.t0{--c:var(--t0)}.btn.t1{--c:var(--t1);--tc:#fff}
.btn.big{padding:18px 26px;font-size:22px;border-radius:20px}
.btn.sm{padding:6px 12px;font-size:15px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.block{width:100%}

.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.25)}

/* top bar */
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.logo{font-weight:800;font-size:22px;letter-spacing:.3px;display:flex;align-items:center;gap:8px;cursor:pointer}
.logo .d{font-size:28px;animation:flick 2.4s infinite}
@keyframes flick{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.06)}}

/* score strip */
.strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.team{border-radius:18px;padding:8px 14px;display:flex;align-items:center;gap:10px;color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.team.t0{background:var(--t0)}.team.t1{background:var(--t1);color:#fff}
.team .nm{font-weight:800;font-size:18px;cursor:pointer;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .sc{font-size:34px;font-weight:800;line-height:1}
.team.lead .nm::after{content:" 👑"}
.bump{animation:bump .5s}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

/* tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;padding:8px 16px;font-weight:700;font-size:16px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.tab.on{background:#fff;color:var(--ink)}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{border:0;border-radius:22px;padding:18px 14px;text-align:left;color:var(--ink);cursor:pointer;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 6px 0 rgba(0,0,0,.35);transition:transform .08s}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.tile .em{font-size:40px}
.tile b{font-size:20px;display:block}
.tile small{font-size:14px;opacity:.8;font-weight:600}

/* big reveal card */
.stage{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.huge{font-size:clamp(34px,7vw,76px);font-weight:800;line-height:1.05}
.big{font-size:clamp(24px,4.5vw,44px);font-weight:800;line-height:1.1}
.ans{color:var(--gold)}
.pill{display:inline-block;border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;background:rgba(255,255,255,.14)}
.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.hidden-q{border:3px dashed rgba(255,255,255,.3);border-radius:20px;padding:30px;cursor:pointer;width:100%}

details.rules{background:rgba(255,255,255,.07);border-radius:16px;padding:10px 14px;margin-bottom:12px}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ol,details.rules ul{margin:8px 0 2px;padding-left:22px}

.timer{font-size:clamp(44px,9vw,90px);font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.timer.low{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.5}}

input.field{width:100%;font:inherit;font-size:20px;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:rgba(0,0,0,.25);color:#fff;outline:none}
input.field:focus{border-color:var(--gold)}

/* tambola */
.ticket{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#fff7e0;padding:10px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.cell{border:0;border-radius:12px;background:#fff;color:var(--ink);min-height:74px;padding:6px;font-weight:800;font-size:15px;line-height:1.1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:inset 0 0 0 2px #f1dfae;position:relative}
.cell small{font-weight:600;font-size:11px;opacity:.6;margin-top:3px}
.cell.on{background:var(--pink);color:#fff;box-shadow:none}
.cell.on::after{content:"✓";position:absolute;top:2px;right:6px;font-size:14px}
.cell.called{background:var(--teal)}
.calledlist{display:flex;flex-wrap:wrap;gap:6px}
.calledlist span{background:rgba(255,255,255,.12);border-radius:10px;padding:2px 10px;font-size:14px}

/* full-screen phone games */
.fs{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.fs .bar{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;gap:10px}
.split{flex:1;display:grid;grid-template-columns:1fr 1fr}
.split button{border:0;font-size:28px;font-weight:800;color:#fff;cursor:pointer}
.word-over{position:absolute;left:0;right:0;top:30%;text-align:center;pointer-events:none;padding:0 16px}
canvas.pad{flex:1;width:100%;background:#fff;touch-action:none;display:block}
.swatch{width:34px;height:34px;border-radius:50%;border:3px solid #fff;cursor:pointer}
.swatch.on{outline:3px solid var(--gold)}

/* mafia */
.rolecard{border-radius:26px;padding:26px;text-align:center;min-height:300px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;user-select:none;-webkit-user-select:none;touch-action:none}
.rolecard .em{font-size:80px}
.roles-table{width:100%;border-collapse:collapse}
.roles-table td{padding:6px 8px;border-bottom:1px solid var(--line)}
.dead{opacity:.4;text-decoration:line-through}

table.score{width:100%;border-collapse:collapse;font-size:18px}
table.score th,table.score td{padding:8px;border-bottom:1px solid var(--line);text-align:center}
table.score th:first-child,table.score td:first-child{text-align:left}

.confetti{position:fixed;top:-20px;font-size:26px;z-index:50;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:var(--ink);font-weight:800;padding:10px 18px;border-radius:999px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.team .sc{font-size:28px}.team .nm{font-size:16px}#app{padding:10px 12px 40px}}
</style>
</head>

/* ---------------- helpers ---------------- */
function hashStr(s){let h=2166136261>>>0;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0;}return h;}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(arr,rng=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const norm = s => String(s||'').trim().toLowerCase().replace(/\s+/g,' ');
const store = {
  get(k,d){try{const v=localStorage.getItem('dg_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('dg_'+k,JSON.stringify(v));}catch(e){}}
};
function h(tag,attrs,...kids){
  const el=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==='class')el.className=v; else if(k==='style')el.style.cssText=v;
    else if(k.startsWith('on'))el.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat()){if(c==null||c===false)continue;el.append(c.nodeType?c:String(c));}
  return el;
}
const btn=(label,cls,on)=>h('button',{class:'btn '+(cls||''),onclick:on},label);
let audioCtx;
function beep(freq=880,dur=.15,type='sine'){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=.15;o.connect(g);g.connect(audioCtx.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);o.stop(audioCtx.currentTime+dur);}catch(e){}}
function buzzer(){beep(220,.6,'sawtooth');try{navigator.vibrate&&navigator.vibrate(400)}catch(e){}}
function ding(){beep(1046,.12);setTimeout(()=>beep(1318,.18),110);}
function toast(msg){const t=h('div',{class:'toast pop'},msg);document.body.append(t);setTimeout(()=>t.remove(),1800);}
function confetti(n=40){const em=['🪔','✨','🎉','🌼','💥','🎆'];for(let i=0;i<n;i++){const c=h('div',{class:'confetti',style:`left:${Math.random()*100}vw;animation-duration:${2+Math.random()*2.5}s;animation-delay:${Math.random()*.6}s`},em[i%em.length]);document.body.append(c);setTimeout(()=>c.remove(),5200);}}

/* cleanup between screens (timers, listeners) */
let cleanups=[];
function onCleanup(f){cleanups.push(f);}
function runCleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[];document.querySelectorAll('.fs').forEach(e=>e.remove());}

function makeTimer(secs,{onEnd,onTick,big=true}={}){
  let left=secs,iv=null;
  const el=h('div',{class:big?'timer':'timer',style:big?'':'font-size:40px'},fmt(left));
  function fmt(s){return s>=60?Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):String(s);}
  function paint(){el.textContent=fmt(left);el.classList.toggle('low',left<=10&&left>0);}
  const api={el,
    start(){if(iv)return;iv=setInterval(()=>{left--;paint();onTick&&onTick(left);if(left<=3&&left>0)beep(660,.08);if(left<=0){api.stop();buzzer();onEnd&&onEnd();}},1000);},
    stop(){clearInterval(iv);iv=null;},
    reset(s=secs){api.stop();left=s;paint();},
    get running(){return !!iv},get left(){return left}
  };
  onCleanup(api.stop);
  return api;
}

function decrypt(pin){
  try{
    const bin=atob(HOSTDATA);const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const rng=mulberry32(hashStr('diwali|'+pin));
    for(let i=0;i<bytes.length;i++)bytes[i]^=Math.floor(rng()*256);
    const obj=JSON.parse(new TextDecoder().decode(bytes));
    return obj.ok==='diwali'?obj:null;
  }catch(e){return null;}
}
